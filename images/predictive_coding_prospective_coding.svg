nt-size="18.6667" transform="matrix(1 0 0 0.99959 481.835 53)">(</text><text fill="#FFFFFF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 487.671 53)">予見的符号化</text><text fill="#FFFFFF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 599.717 53)">,</text><text fill="#FFFFFF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 608.72 53)">前向き符号化</text><text fill="#FFFFFF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 720.766 53)">)</text><text fill="#FFFFFF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 141.632 30)">Predictive</text><text fill="#FFFFFF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 223.286 30)">Coding</text><text fill="#FFFFFF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 156.612 53)">(</text><text fill="#FFFFFF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 162.448 53)">予測符号化</text><text fill="#FFFFFF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 255.819 53)">)</text><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 416.872 84)">「将来必要になる予測や、次にとるべき行</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 416.872 107)">動」の形で情報をあらかじめ脳内に保持して</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 416.872 129)">おく</text></g><text fill="#0000FF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 454.221 129)">方略、表現方法</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 584.941 129)">。</text><g><text font-family="Cambria Math,Cambria Math_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 416.872 152)">⇔</text></g><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 440.048 152)">Retrospective coding</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 601.721 152)">（回顧的符号化）</text><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 20.6093 84)">脳が過去の経験から行う予測と、感覚入力か</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 20.6093 107)">らの情報の誤差</text></g><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 151.33 107)">(</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 157.165 107)">予測誤差</text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 231.863 107)">)</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 237.698 107)">が小さくなるよう</text><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 20.6093 129)">に脳内の内部モデルをアップデートするとい</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 20.6093 151)">う</text></g><text fill="#0000FF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6667" transform="matrix(1 0 0 0.99959 39.2836 151)">アルゴリズム</text></g></svg>