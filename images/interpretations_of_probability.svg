<svg width="643" height="312" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" overflow="hidden"><defs><clipPath id="clip0"><rect x="0" y="0" width="643" height="312"/></clipPath></defs><g clip-path="url(#clip0)"><rect x="0" y="0" width="643" height="311.924" fill="#FFFFFF"/><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 7.21695 21)">確率解釈</text><path d="M38.5 28.493 38.5 44.4892 59.5 44.4892" stroke="#000000" stroke-width="1.33437" stroke-miterlimit="8" fill="none" fill-rule="evenodd"/><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 64.404 51)">客観確率</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 126.452 51)">･･･</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 151.805 51)">客観的な世界</text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 239.874 51)">(</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 244.377 51)">物理的現実</text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 317.768 51)">)</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 322.271 51)">に確率の根拠を求める立場</text><path d="M92.5 57.486 92.5 74.4819 114.5 74.4819" stroke="#000000" stroke-width="1.33437" stroke-miterlimit="8" fill="none" fill-rule="evenodd"/><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 117.767 80)">頻度主義</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 179.815 80)">･･･</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 205.168 80)">確率とは「同じ条件下で試行を多数回（理論上は無限回）</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 205.835 97)">繰り返したとき、特定の事象が起きる相対頻度の極限値」</text><text fill="#0000FF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 205.835 121)">同じ条件で何度も繰り返すことができないと適用できない。</text><text fill="#0000FF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 205.835 139)">説明の放棄</text><text fill="#0000FF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 279.225 139)">(</text><text fill="#0000FF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 283.729 139)">なぜその確率になるのか？は考えない。手続きのみ</text><text fill="#0000FF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 621.325 139)">)</text><path d="M92.5 73.4821 92.5 160.461 114.5 160.461" stroke="#000000" stroke-width="1.33437" stroke-miterlimit="8" fill="none" fill-rule="evenodd"/><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 117.245 167)">傾向主義</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 179.293 167)">･･･</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 204.646 167)">確率とは「ある物理的な実験装置や状況が、特定の結果</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 205.314 184)">を生み出そうとする内在的な性質（傾向性・ポテンシャル）</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 205.314 202)">の強さ」</text><text fill="#0000FF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 193.971 226)">「傾向性」という目に見えない性質を直接測定する方法がなく、</text><text fill="#0000FF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 205.314 243)">結局は頻度を観測して推測するしかない</text><path d="M38.5 44.4892 38.5 267.435 59.5 267.435" stroke="#000000" stroke-width="1.33437" stroke-miterlimit="8" fill="none" fill-rule="evenodd"/><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 64.404 276)">主観確率</text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 123.116 276)">(</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 127.62 276)">ベイズ主義</text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 201.01 276)">)</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 208.85 276)">･･･</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 234.203 276)">事象を観察する人の信念の度合い</text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 454.374 276)">(</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 458.877 276)">予測モデルの尤度</text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 576.302 276)">)</text><text fill="#0000FF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 225.863 300)">同じ事象に対して人により信念が異なる</text><text fill="#0000FF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 490.068 300)">(</text><text fill="#0000FF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 494.572 300)">客観性がない</text><text fill="#0000FF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="14.6745" transform="matrix(1 0 0 0.999756 582.64 300)">)</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="10.6724" transform="matrix(1 0 0 0.999756 68.8521 293)">ベイズ</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="10.6724" transform="matrix(1 0 0 0.999756 123.638 99)">リヒャルト</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="10.6724" transform="matrix(1 0 0 0.999756 177.013 99)">・</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="10.6724" transform="matrix(1 0 0 0.999756 123.638 112)">フォン・</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="10.6724" transform="matrix(1 0 0 0.999756 123.638 124)">ミーゼス</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="10.6724" transform="matrix(1 0 0 0.999756 122.943 185)">カール</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="10.6724" transform="matrix(1 0 0 0.999756 154.968 185)">・</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="10.6724" transform="matrix(1 0 0 0.999756 122.943 198)">ポパー</text></g></svg>