000" stroke-width="1.33388" stroke-linejoin="round" stroke-miterlimit="10" fill="none" fill-rule="evenodd"/><path d="M11.4184 10.5026 11.4184 299.425" stroke="#000000" stroke-width="1.33388" stroke-linejoin="round" stroke-miterlimit="10" fill="none" fill-rule="evenodd"/><path d="M801.582 10.5026 801.582 299.425" stroke="#000000" stroke-width="1.33388" stroke-linejoin="round" stroke-miterlimit="10" fill="none" fill-rule="evenodd"/><path d="M10.7515 11.1696 802.249 11.1696" stroke="#000000" stroke-width="1.33388" stroke-linejoin="round" stroke-miterlimit="10" fill="none" fill-rule="evenodd"/><path d="M10.7515 298.758 802.249 298.758" stroke="#000000" stroke-width="1.33388" stroke-linejoin="round" stroke-miterlimit="10" fill="none" fill-rule="evenodd"/><text fill="#FFFFFF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 568.97 33)">Hypothesis</text><text fill="#FFFFFF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 659.341 33)">(</text><text fill="#FFFFFF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 665.176 33)">仮説</text><text fill="#FFFFFF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 702.525 33)">)</text><text fill="#FFFFFF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 211.911 33)">Assumption</text><text fill="#FFFFFF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 308.71 33)">(</text><text fill="#FFFFFF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 314.546 33)">前提・仮定</text><text fill="#FFFFFF" font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 407.918 33)">)</text><text fill="#FFFFFF" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 61.9926 33)">項目</text><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 485.353 65)">限られた証拠を基づき、これから</text></g><text fill="#FF0000" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 765.468 65)">検</text><g><text fill="#FF0000" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 485.353 88)">証するために立てる</text></g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 653.422 88)">理論や推測</text><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 159.519 65)">証拠はないが、</text></g><text fill="#FF0000" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 290.24 65)">とりあえず正しいと</text><g><text fill="#FF0000" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 159.519 88)">して</text></g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 196.868 88)">受け入れること</text><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 21.0224 65)">定義</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 485.353 119)">真実や因果関係を科学的。論理的に</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 485.353 142)">説明する</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 159.519 119)">議論や計画をスムーズに進める</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 21.0224 119)">目的</text></g><g><text fill="#FF0000" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 485.353 174)">検証する</text></g><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 564.218 174)">(</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 570.054 174)">実験やデータ収集</text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 719.449 174)">)</text><g><text fill="#FF0000" font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 159.519 174)">必要ない</text></g><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 238.385 174)">(</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 244.221 174)">正しいものとして扱う</text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 430.964 174)">)</text><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 21.0224 174)">検証の必要性</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 485.353 212)">価格を</text></g><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 541.376 212)">10%</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 574.056 212)">下げれば、新規顧客が</text><g><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 485.353 235)">20%</text></g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 518.033 235)">増えるという仮説を検証する</text><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 159.519 212)">来期も市場シェアは維持できると仮</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 159.519 235)">定して予算を組む</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 21.0224 212)">例</text></g><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 43.8651 212)">(</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 49.7008 212)">ビジネス</text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 124.398 212)">)</text><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 485.353 266)">この薬を投与すると、血圧が下がる</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 485.353 289)">という仮説を立て、検証する</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 159.519 266)">実験中、室温は一定であると前提を</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 159.519 289)">おく</text></g><g><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 21.0224 266)">例</text></g><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 43.8651 266)">(</text><text font-family="Yu Gothic,Yu Gothic_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 49.7008 266)">科学</text><text font-family="Calibri,Calibri_MSFontService,sans-serif" font-weight="700" font-size="18.6766" transform="matrix(1 0 0 1.00012 87.0494 266)">)</text></g></svg>